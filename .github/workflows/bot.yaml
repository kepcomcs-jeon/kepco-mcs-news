name: KEPCO-MCS News Bot

on:
  # 💡 외부 스케줄러(cron-job.org)와 중복 실행을 막기 위해 기존 깃허브 cron은 비활성화
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch: # 웹에서 수동으로 즉시 실행할 수 있는 버튼 활성화
  repository_dispatch: # 외부 스케줄러(cron-job.org)에서 10분마다 호출하는 트리거
    types: [run-news-bot]

# 💡 [핵심 추가] 깃허브 서버가 파일 변경사항을 저장(Commit)할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: 🚀 뉴스 모니터링 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python news_bot.py

      - name: 💾 엑셀 대장 및 중복 방지 파일 자동 저장 (Git Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 365일 연중무휴 10분 간격 자동 뉴스 수집 결과 업데이트"
          file_pattern: "*.txt *.xlsx"