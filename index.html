<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 크기에 딱 맞추고 확대/축소 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>위험성평가 AI</title>

    <!-- 한전MCS 전용 아이콘 강제 적용 -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jjeonceo1-glitch/kepco-mcs-news/main/safety_check_app/app_icon.png">
    <link rel="icon" sizes="192x192" href="https://raw.githubusercontent.com/jjeonceo1-glitch/kepco-mcs-news/main/safety_check_app/app_icon.png">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/jjeonceo1-glitch/kepco-mcs-news/main/safety_check_app/app_icon.png">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- 카메라와 위치(GPS) 권한 모두 허용 -->
    <iframe id="safety-frame" allow="camera; microphone; geolocation" allowfullscreen></iframe>

    <script>
        // ?branch=영광지점 같은 QR 파라미터가 있으면 그대로 유지하면서 embed=true 추가
        const params = new URLSearchParams(window.location.search);
        params.set("embed", "true");
        document.getElementById("safety-frame").src =
            "https://kepcomcs-safety.streamlit.app/?" + params.toString();
    </script>
</body>
</html>
